name: "py check"
description: "set up python, install deps, lint and test"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: pip install -r requirements.txt
      shell: bash

    - run: pip install flake8 pytest
      shell: bash

    - run: flake8 .
      shell: bash

    - run: pytest
      shell: bash